:root{--ink:#4a2f1b;--muted:#8a6a50;--cream:#fff8ec;--orange:#ff8a3d;--orange-d:#e0651c;--green:#22a861;--green-d:#178a4c;--red:#e84545;--blue:#3d8bff;--line:#f0dcc0;--sheetH:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:"Baloo",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* HUD */
#hud{position:fixed;top:0;inset-inline:0;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hud[hidden]{display:none}
.chip{display:flex;align-items:center;gap:6px;background:#fffdf7ee;border-radius:999px;padding:4px 14px 2px;font-weight:800;font-size:19px;box-shadow:0 3px 0 #e7cfae,0 6px 16px #6b3d1222}
.chip .ic{font-size:20px}
#hud .sp{flex:1}
.rbtn{width:44px;height:44px;border-radius:50%;background:#fffdf7ee;font-size:21px;box-shadow:0 3px 0 #e7cfae,0 6px 16px #6b3d1222;display:grid;place-items:center}
.rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #e7cfae}
/* bubbles */
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:3}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:18px;padding:5px 12px 2px;font-size:22px;font-weight:800;white-space:nowrap;box-shadow:0 6px 18px #5a341522;transition:opacity .2s}
.bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.pop{animation:pop .35s}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(.4)}70%{transform:translate(-50%,-100%) scale(1.12)}100%{transform:translate(-50%,-100%) scale(1)}}
/* sheet */
#sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);max-height:56vh;display:flex;flex-direction:column;background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px #5a341533;z-index:6;padding-bottom:env(safe-area-inset-bottom);transition:transform .3s}
#sheet.hide{transform:translate(-50%,110%)}
.helper{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 6px}
.cat{flex:none;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd29c,#ff9a4a);display:grid;place-items:center;font-size:31px;box-shadow:0 3px 0 #d9722d}
.say{flex:1;background:#fff;border-radius:16px;padding:7px 12px 4px;font-size:16.5px;line-height:1.45;font-weight:600;position:relative;min-height:44px}
.say b{color:var(--orange-d)}
.ph{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
#body{overflow:auto;padding:4px 14px 12px;overscroll-behavior:contain}
.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px 12px;border-top:2px dashed var(--line)}
.big{border-radius:18px;padding:11px 22px 7px;font-weight:800;font-size:20px;color:#fff;background:var(--orange);box-shadow:0 5px 0 var(--orange-d);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--orange-d)}
.big.g{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.big.w{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e3cdb0}
.big[disabled]{opacity:.45;pointer-events:none}
.sum{font-size:15px;font-weight:700;color:var(--muted);line-height:1.3}
.sum b{font-size:20px;color:var(--ink)}
/* buy grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border-radius:18px;padding:8px 10px 10px;box-shadow:0 3px 0 var(--line);text-align:center}
.card .em{font-size:34px;line-height:1.2}
.card .nm{font-weight:800;font-size:17px}
.card .pr{font-size:13.5px;color:var(--muted);font-weight:600}
.card .pr b{color:var(--orange-d);font-size:16px}
.step{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.sb{width:42px;height:42px;border-radius:14px;font-size:24px;font-weight:800;background:#ffe7cf;color:var(--orange-d);box-shadow:0 3px 0 #f2c79d}
.sb.p{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-d)}
.sb:active{transform:translateY(2px);box-shadow:none}
.step .v{min-width:44px;font-size:22px;font-weight:800}
.tag{display:inline-block;border-radius:999px;padding:1px 9px 0;font-size:12.5px;font-weight:800;margin-top:4px}
.tag.ok{background:#dcf5e7;color:#178a4c}.tag.hi{background:#ffe0e0;color:#c42f2f}.tag.lo{background:#fff1c9;color:#9a6b00}
/* sale */
.lines{background:#fff;border-radius:18px;padding:6px 12px;box-shadow:0 3px 0 var(--line)}
.ln{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:19px;font-weight:700;border-bottom:1px dashed var(--line)}
.ln:last-child{border:0}
.ln .em{font-size:28px}
.ln .x{flex:1;color:var(--muted)}
.ln .r{font-weight:800;min-width:70px;text-align:end}
.ln.tot{font-size:22px}
.ln.tot .r{color:var(--orange-d)}
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.choice{min-width:110px;border-radius:18px;padding:10px 16px 6px;font-size:24px;font-weight:800;background:#fff;box-shadow:0 5px 0 #e3cdb0}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #e3cdb0}
.choice.bad{background:#ffe0e0;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.disp{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 6px}
.disp .scr{min-width:160px;background:#2c3e50;color:#7dffb3;border-radius:14px;padding:6px 16px 2px;font-size:30px;font-weight:800;text-align:center;font-family:"Baloo",monospace;direction:ltr}
.disp .scr.bad{animation:shake .35s;color:#ff8f8f}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto;direction:ltr}
.pad button{height:46px;border-radius:14px;background:#fff;font-size:24px;font-weight:800;box-shadow:0 4px 0 #e3cdb0}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #e3cdb0}
.pad .okk{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);grid-row:span 2;height:auto}
.msg{text-align:center;font-weight:700;font-size:16px;margin-top:8px;min-height:24px}
.msg.bad{color:var(--red)}.msg.good{color:var(--green-d)}
/* money */
.m{display:inline-grid;place-items:center;flex:none;position:relative;font-weight:800;color:#3a3a3a;vertical-align:middle}
.coin{border-radius:50%;box-shadow:inset 0 -3px 0 #0002,0 3px 0 #0003}
.coin b{font-size:17px;line-height:1;padding-top:3px}
.c50{width:40px;height:40px;background:radial-gradient(circle at 35% 30%,#ffd9a3,#d38a45);font-size:14px}
.c50 b{font-size:14px}
.c100{width:46px;height:46px;background:radial-gradient(circle at 35% 30%,#ffffff,#b7bec7)}
.c200{width:52px;height:52px;background:radial-gradient(circle at 35% 30%,#ffffff,#a9b2bd)}
.c500{width:56px;height:56px;background:radial-gradient(circle,#f3d27a 0 50%,#c9a43a 51% 54%,#e9edf1 55%,#b1b9c3 100%)}
.c1000{width:60px;height:60px;background:radial-gradient(circle,#eef1f4 0 48%,#b9c0c8 49% 52%,#f6d77c 53%,#c99a2e 100%)}
.note{width:96px;height:52px;border-radius:7px;box-shadow:0 3px 0 #0003;color:#fff;overflow:hidden}
.note:before{content:"";position:absolute;inset:5px;border:2px solid #fff6;border-radius:4px}
.note:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff3;inset-inline-start:9px;top:13px}
.note b{font-size:22px;line-height:1;padding-top:4px;text-shadow:0 2px 0 #0003}
.note i{position:absolute;bottom:3px;inset-inline-end:9px;font-style:normal;font-size:10.5px;opacity:.9}
.n2000{background:linear-gradient(135deg,#9b6fd6,#6d41b0)}
.n5000{background:linear-gradient(135deg,#4fbf7a,#24834a)}
.n10000{background:linear-gradient(135deg,#c89a6a,#8c5a2e)}
.n20000{background:linear-gradient(135deg,#5aa0e6,#2a64b0)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;background:#f6e3c6;border-radius:18px;padding:10px;box-shadow:inset 0 3px 8px #8a5a2a22}
.tray .m{cursor:pointer;transition:transform .08s}
.tray .m:active{transform:scale(.9)}
.given{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:62px;background:#fff;border-radius:18px;padding:6px 10px;border:3px dashed #f3c99c;margin:10px 0}
.given .m{cursor:pointer;animation:drop .25s}
@keyframes drop{from{transform:translateY(-18px) scale(.7);opacity:0}}
.given .lab{font-weight:800;color:var(--muted);font-size:15px;margin-inline-end:4px}
.given .tot{margin-inline-start:auto;font-size:22px;font-weight:800;color:var(--orange-d)}
.payrow{display:flex;align-items:center;gap:12px;justify-content:center;font-size:19px;font-weight:700;flex-wrap:wrap}
/* report */
.rep{display:grid;gap:8px}
.rrow{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:8px 14px 5px;font-size:18px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.rrow .v{font-weight:800}
.rrow.in .v{color:var(--green-d)}.rrow.out .v{color:var(--red)}
.rrow.res{font-size:22px;background:linear-gradient(90deg,#fff3d6,#ffe2bd)}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.badge{background:#fff;border-radius:999px;padding:4px 14px 2px;font-weight:800;box-shadow:0 3px 0 var(--line)}
/* title */
#title{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,#fff3e000 30%,#5a2e0f55)}
#title.hide{display:none}
.tcard{width:min(520px,100%);background:#fff8eef2;border-radius:30px;padding:20px 18px 18px;text-align:center;box-shadow:0 20px 60px #5a2e0f55;backdrop-filter:blur(6px)}
.tcard h1{margin:0;font-size:44px;line-height:1.15;color:var(--orange-d);text-shadow:0 3px 0 #ffd3a6}
.tcard .s{font-size:17px;font-weight:600;color:var(--muted);margin:2px 0 12px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.lvb{background:#fff;border-radius:18px;padding:8px 6px 6px;box-shadow:0 4px 0 #ead3b4;border:3px solid transparent}
.lvb .e{font-size:32px}.lvb .n{font-weight:800;font-size:18px}.lvb .d{font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.lvb.on{border-color:var(--orange);background:#fff3e6}
.tbtns{display:grid;gap:10px}
.langs{display:flex;gap:6px;justify-content:center;margin-top:14px}
.langs button{border-radius:999px;padding:5px 14px 2px;font-weight:800;background:#fff;box-shadow:0 3px 0 #ead3b4}
.langs button.on{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-d)}
.toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:20;font-size:38px;font-weight:800;color:#fff;text-shadow:0 4px 0 #e0651c,0 8px 20px #0004;pointer-events:none;animation:toast 1.3s forwards;white-space:nowrap}
@keyframes toast{0%{transform:translate(-50%,20px) scale(.5);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
.confirm{position:fixed;inset:0;z-index:30;background:#0005;display:grid;place-items:center;padding:20px}
.confirm>div{background:var(--cream);border-radius:24px;padding:18px;max-width:380px;text-align:center;font-size:18px;font-weight:700}
.confirm .r{display:flex;gap:10px;justify-content:center;margin-top:14px}
@media (orientation:portrait){#sheet{max-height:62vh}}
@media (max-width:640px){#hud{flex-wrap:wrap;gap:6px}.rbtn{width:38px;height:38px;font-size:18px}#hud .sp{flex-basis:100%;height:0}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.say{font-size:15px}.chip{font-size:17px;padding:4px 11px 2px}.big{font-size:18px;padding:10px 16px 6px}.tcard h1{font-size:36px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bubbles"></div>
<div id="hud" hidden>
  <div class="chip" id="hDay"></div>
  <div class="chip"><span class="ic">💰</span><span id="hCash"></span></div>
  <div class="chip"><span class="ic">⭐</span><span id="hStars"></span></div>
  <div class="sp"></div>
  <button class="rbtn" id="bVoice" title="Voix">🗣️</button>
  <button class="rbtn" id="bSnd" title="Son">🔊</button>
  <button class="rbtn" id="bHome" title="Accueil">🏠</button>
</div>
<div id="sheet" class="hide">
  <div class="helper"><div class="cat">🐱</div><div class="say"><div class="ph" id="sPh"></div><div id="sSay"></div></div></div>
  <div id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="title">
  <div class="tcard">
    <h1 id="tT"></h1><div class="s" id="tS"></div>
    <div class="ph" id="tL"></div>
    <div class="lv" id="tLv"></div>
    <div class="tbtns" id="tB"></div>
    <div class="langs" id="tLang"></div>
  </div>
</div>

 return{g,head,eyes,legs,tail,body,mode:"idle",timer:2,t:0,target:null,hop:0,tilt:0,bub:null,after:null}})();

function catBub(html,ms){if(!cat.bub){cat.bub=document.createElement("div");cat.bub.className="bub";$("#bubbles").appendChild(cat.bub)}cat.bub.innerHTML=html;cat.bub.style.opacity=1;clearTimeout(cat.bt);if(ms)cat.bt=setTimeout(()=>cat.bub.style.opacity=0,ms)}
function catGo(x,z,then){cat.target=new THREE.Vector3(x,0,z);cat.after=then;cat.mode="walk"}
function catJump(to,dur,then){cat.jumpFrom=cat.g.position.clone();cat.jumpTo=to;cat.jt=0;cat.jd=dur;cat.mode="jump";cat.after=then}
function catToCounter(){if(cat.mode==="counter"||cat.goingCounter)return;cat.goingCounter=true;if(cat.bub)cat.bub.style.opacity=0;
 const go=()=>catGo(1.0,2.25,()=>catJump(new THREE.Vector3(1.0,.9,3.0),.45,()=>{cat.mode="counter";cat.goingCounter=false;cat.face=0}));
 if(cat.mode==="jump")setTimeout(catToCounter,500),cat.goingCounter=false;else go()}
function catLeaveCounter(){if(cat.mode!=="counter"){cat.goingCounter=false;if(cat.mode==="walk"&&cat.target&&cat.target.x===1.0){cat.mode="idle";cat.timer=.5}return}
 catJump(new THREE.Vector3(1.0,0,2.25),.45,()=>{cat.mode="idle";cat.timer=.6})}
function catCheer(){cat.hop=.75;sfxMeow();catBub("😻",1100)}

function updateCat(dt){const c=cat,p=c.g.position;c.t+=dt;let moving=false;
 if(c.mode==="idle"){c.timer-=dt;if(c.timer<0){const r=Math.random();if(r<.22)catGo(4.25,1.1,()=>{c.mode="sleep";c.timer=7+Math.random()*7;c.face=-Math.PI/2;catBub("💤")});else catGo(3.0+Math.random()*1.8,-1.0+Math.random()*3,()=>{c.mode="idle";c.timer=1.5+Math.random()*3;c.face=Math.random()<.6?0:c.g.rotation.y})}}
 else if(c.mode==="walk"&&c.target){V.subVectors(c.target,p);V.y=0;const d=V.length();if(d<.04){p.x=c.target.x;p.z=c.target.z;c.target=null;c.mode="idle";c.timer=99;const f=c.after;c.after=null;f&&f()}else{moving=true;V.normalize();p.addScaledVector(V,Math.min(d,(FAST?10:2.4)*dt));c.face=Math.atan2(V.x,V.z)}}
 else if(c.mode==="jump"){c.jt+=dt;const k=Math.min(1,c.jt/c.jd);p.lerpVectors(c.jumpFrom,c.jumpTo,k);p.y+=Math.sin(k*Math.PI)*.5;c.face=Math.atan2(c.jumpTo.x-c.jumpFrom.x,c.jumpTo.z-c.jumpFrom.z);if(k>=1){c.baseY=c.jumpTo.y;const f=c.after;c.after=null;c.mode="idle";c.timer=99;f&&f()}}
 else if(c.mode==="sleep"){c.timer-=dt;if(c.timer<0){c.mode="idle";c.timer=1;if(c.bub)c.bub.style.opacity=0}}
 if(c.face!==undefined&&c.mode!=="jump"){let d=c.face-c.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));c.g.rotation.y+=d*Math.min(1,dt*8)}
 // pattes, queue, respiration, yeux
 const ph=c.t*14;c.legs.forEach((l,i)=>l.rotation.x=moving?Math.sin(ph+(i%2?Math.PI:0)+(i>1?Math.PI/2:0))*.7:0);
 const sleeping=c.mode==="sleep";c.tail.forEach((s,i)=>{s.rotation.x=i?(sleeping?.18:-.32+Math.sin(c.t*3+i*.6)*.12):(sleeping?1.3:-.5);s.rotation.y=Math.sin(c.t*(sleeping?1:2.6)-i*.5)*(sleeping?.05:.25)});
 c.body.scale.y=.85*(sleeping?.8+Math.sin(c.t*2)*.03:1);c.body.position.y=sleeping?.14:.24;c.legs.forEach(l=>l.visible=!sleeping);c.head.position.y=sleeping?.2:.43;c.head.position.z=sleeping?.3:.27;
 const blink=sleeping||(c.t%3.7<.12);c.eyes.forEach(e=>e.scale.y=blink?.12:1);
 let hy=0;if(c.hop>0){c.hop-=dt;const k=1-c.hop/.75;hy=Math.sin(k*Math.PI)*.55;c.g.rotation.y+=dt*8.4}
 if(c.mode!=="jump")p.y=(c.baseY||0)+(sleeping?.1:0)+hy;
 if(c.tilt>0){c.tilt-=dt;c.head.rotation.z=Math.sin((1.2-c.tilt)*6)*.35}else c.head.rotation.z=sleeping?.4:Math.sin(c.t*.8)*.08;
 if(c.bub)placeBub(c.bub,p.x,p.y+.95,p.z)}

/* ---------- 1. Achat au fournisseur ---------- */
function buyPhase(){st.phase="buy";X.morning();save();truckTarget=-9.2;sfx.truck();doorTarget=-1.3;
 const L=LV[st.level];
 // filet de sécurité : plus d'argent ni de stock
 const anyStock=P.some(p=>st.stock[p.id]>0),minCost=Math.min(...P.map(p=>cartonCost(st.level,p.id)));
 let giftMsg="";if(!anyStock&&st.cash<minCost){const g=Math.max(minCost*2,L.start/2);st.cash+=g;giftMsg=`<br><b>${t("gift",money(g))}</b>`;save();hud()}
 const intro=(st.firstDone?t("hBuy"):t("hBuyFirst"))+giftMsg+X.morningMsg();
 const draw=()=>{const tb=st.today.bought;let spent=0;P.forEach(p=>spent+=(tb[p.id]||0)*cartonCost(st.level,p.id));
  showSheet(t("phBuy"),intro,`<div class="grid">${P.filter(X.showProd).map(p=>{const n=tb[p.id]||0;return`<div class="card"><div class="em">${p.e}</div><div class="nm">${pn(p.id)}</div><div class="pr">${t("carton",cartonOf(p.id))} = <b>${money(cartonCost(st.level,p.id))}</b></div><div class="pr">${t("onShelf",st.stock[p.id])}</div><div class="step"><button class="sb" data-b="-${p.id}" ${n?"":"disabled style='opacity:.35'"}>−</button><span class="v">${n}</span><button class="sb p" data-b="+${p.id}">+</button></div></div>`}).join("")}</div>`,
  `<div class="sum">${t("buyTot")} <b>${money(spent)}</b><br>${t("cashLeft")} <b>${money(st.cash)}</b></div><button class="big" data-act="toPrice">${t("next")}</button>`)};
 draw();
 body.onclick=e=>{const b=e.target.closest("[data-b]");if(!b)return;const add=b.dataset.b[0]==="+",id=b.dataset.b.slice(1),c=cartonCost(st.level,id),tb=st.today.bought;
  if(add){if(st.cash<c){sfx.bad();toast("💸");setSay(`<b>${t("noMoney")}</b>`);return}if(st.stock[id]+cartonOf(id)>SHELF_MAX){sfx.bad();setSay(`<b>${t("full")}</b>`);return}
   st.cash-=c;st.stock[id]+=cartonOf(id);tb[id]=(tb[id]||0)+1;st.today.spent+=c;sfx.coin()}
  else{if(!tb[id])return;st.cash+=c;st.stock[id]-=cartonOf(id);tb[id]--;st.today.spent-=c;sfx.tap()}
  refreshShelf(id);save();hud();const y=body.scrollTop;draw();body.scrollTop=y};
 foot.onclick=e=>{if(!e.target.closest("[data-act=toPrice]"))return;sfx.tap();if(!P.some(p=>st.stock[p.id]>0)){sfx.bad();setSay(`<b>${t("empty")}</b>`);return}
  truckTarget=-14;if(LV[st.level].setPrice)pricePhase();else openShop()}}

 const draw=()=>showSheet(t("phPrice"),t("hPrice"),`<div class="grid">${P.filter(X.showProd).map(p=>{const s=priceState(p.id),uc=cartonCost(st.level,p.id)/cartonOf(p.id);return`<div class="card"><div class="em">${p.e}</div><div class="nm">${pn(p.id)}</div><div class="pr">${t("costU",money(Math.round(uc/10)*10))}</div><div class="step"><button class="sb" data-p="-${p.id}">−</button><span class="v">${fmt(st.price[p.id])}</span><button class="sb p" data-p="+${p.id}">+</button></div><span class="tag ${s}">${s==="ok"?"😊 "+t("okP"):s==="hi"?"😠 "+t("highP"):"⚠️ "+t("lowP")}</span></div>`}).join("")}</div>`,

/* ---------- 3. Vente ---------- */
function makeOrder(){const L=LV[st.level],PP=P.filter(X.orderable);
 for(let k=0;k<80;k++){const stocked=PP.filter(p=>st.stock[p.id]>0),n=1+rnd(L.maxItems),items=[],used=new Set();
  for(let i=0;i<n;i++){const src=(stocked.length&&Math.random()<.85?stocked:PP).filter(x=>!used.has(x.id));if(!src.length)break;const p=pick(src);used.add(p.id);items.push({id:p.id,q:1+rnd(L.qmax)})}
  X.tweakOrder(items);const tot=items.reduce((a,it)=>a+it.q*st.price[it.id],0);if(items.length&&tot<=L.maxTotal)return items}
 return[{id:pick(PP).id,q:1}]}
function payWith(tot){const L=LV[st.level],opts=L.pay.filter(v=>v>=tot);if(!opts.length){const big=L.pay[L.pay.length-1];return Math.ceil(tot/big)*big}
 let i=0;if(opts.length>1&&Math.random()<.4)i=1;if(opts[i]===tot&&opts[i+1]&&Math.random()<.7)i++;return opts[i]}
async function openShop(resume){st.phase="sell";save();doorTarget=0;truckTarget=-14;busy=true;
 const L=LV[st.level];showSheet(t("phSell"),t("hWait"),"","");
 const NC=X.custCount();for(let n=st.today.n;n<NC;n++){
  if(view.title){busy=false;return}
  $("#sPh").textContent=X.eventLabel()+t("phSell")+" · "+t("custN",n+1,NC);$("#sSay").innerHTML=t("hWait");body.innerHTML="";foot.style.display="none";resize();
  await sleep(700);await serveCustomer(makeOrder());st.today.n=n+1;save()}
 busy=false;report()}
async function serveCustomer(order){const L=LV[st.level],c=makeCustomer(X.pickType());scene.add(c.g);c.g.position.set(-8,0,-.95);c.g.rotation.y=Math.PI/2;
 await walk(c,-6.2,-.95);doorTarget=-1.35;sfx.bell();await walk(c,-4.4,-.95);doorTarget=0;
 say(c,order.map(it=>`${it.q>1?it.q+"×":""}${P[PID[it.id]].e}`).join(" "));speak(t("want")+" "+order.map(it=>(it.q>1?it.q+" ":"")+pn(it.id)).join(t("and")),{who:1,pitch:c.pitch,queue:1});
 await X.onEnter(c);await sleep(900);const got=[];
 for(const it of order){const s=slotOf(PID[it.id]);await walk(c,s.x,-2.45);face(c,Math.PI);await sleep(380);
  if(L.setPrice&&st.price[it.id]>BASE(it.id)*1.35){say(c,`${P[PID[it.id]].e} 😠 ${fmt(st.price[it.id])}?!`);setMood(c,-1);setSay(t("hExp",`<b>${pn(it.id)}</b>`));sfx.bad();await sleep(1300);setMood(c,1);continue}
  const have=st.stock[it.id];if(!have){say(c,`${P[PID[it.id]].e} 😢`);setMood(c,-1);setSay(t("hOut",`<b>${pn(it.id)}</b>`));sfx.bad();await sleep(1300);setMood(c,1);continue}
  const q=Math.min(have,it.q);st.stock[it.id]-=q;refreshShelf(it.id);got.push({id:it.id,q});sfx.pop();
  say(c,got.map(g=>`${g.q>1?g.q+"×":""}${P[PID[g.id]].e}`).join(" ")+" 🛒");await sleep(450)}
 if(!got.length){setMood(c,-1);say(c,"😞");setSay(t("hSad"));st.today.sad++;X.onSad();save();await sleep(900);await leave(c);return}
 save();await walk(c,-.2,2.15);face(c,0);putOnCounter(got);await sleep(250);
 const res=await checkout(c,got);
 c.jump=.9;setMood(c,1);say(c,t("thanks"),1500);sfx.good();await X.afterSale(c,got,res);await sleep(950);clearCounter();drawScreen("0");await leave(c)}
async function leave(c){await walk(c,-4.4,-.95);doorTarget=-1.35;await walk(c,-6.4,-.95);doorTarget=0;await walk(c,-8,-.95);removeCustomer(c)}

// passage en caisse : total puis monnaie
function checkout(c,got){return new Promise(resolve=>{const L=LV[st.level];const tot=got.reduce((a,g)=>a+g.q*st.price[g.id],0);let errs=0,tries=0;const paid=payWith(tot);window.__sale={tot,paid};
 const lineHTML=(show)=>`<div class="lines">${got.map(g=>`<div class="ln"><span class="em">${P[PID[g.id]].e}</span><span class="x">${g.q} × ${money(st.price[g.id])}</span><span class="r">${show?"= "+money(g.q*st.price[g.id]):"= ?"}</span></div>`).join("")}${show==="all"?`<div class="ln tot"><span class="x">${t("totA")}</span><span class="r">${money(tot)}</span></div>`:""}</div>`;
 const phase=X.eventLabel()+t("phSell")+" · "+t("custN",st.today.n+1,X.custCount());
 const goChange=()=>{drawScreen(fmt(tot));
  if(paid===tot){showSheet(phase,t("exact"),`${lineHTML("all")}<div class="payrow" style="margin-top:10px">${t("paid")} ${splitMoney(paid,[...L.pay,...L.pieces]).map(v=>moneyHTML(v)).join("")}</div>`,`<span></span><button class="big g" data-act="ok">${t("ok")}</button>`);
   say(c,splitMoney(paid,[...L.pay,...L.pieces]).map(v=>moneyHTML(v)).join(""));sfx.till();view.drawer=true;foot.onclick=e=>{if(!e.target.closest("[data-act=ok]"))return;view.drawer=false;finish()};return}
  view.drawer=true;sfx.till();const given=[];const need=paid-tot;tries=0;
  say(c,`${t("paid")} ${moneyHTML(paid)}`);
  const draw=(msg="",cls="")=>{const sum=given.reduce((a,b)=>a+b,0);
   showSheet(phase,`${t("totA")} <b>${money(tot)}</b> · ${t("paid")} <b>${money(paid)}</b><br>${t("chQ")}`,
   `<div class="payrow">${moneyHTML(paid)} <span>−</span> <b>${money(tot)}</b> <span>=</span> <b>?</b></div>
    <div class="given"><span class="lab">${t("chG")}:</span>${given.map((v,i)=>moneyHTML(v,`data-rm="${i}"`)).join("")}${L.showSum?`<span class="tot">${money(sum)}</span>`:""}</div>
    <div class="tray">${L.pieces.filter(v=>v<paid).map(v=>moneyHTML(v,`data-add="${v}"`)).join("")}</div><div class="msg ${cls}">${msg}</div>`,
   `<button class="big w" data-act="clr">${t("clr")}</button><button class="big g" data-act="give">${t("give")}</button>`)};
  draw();
  body.onclick=e=>{const a=e.target.closest("[data-add]"),r=e.target.closest("[data-rm]");if(a){given.push(+a.dataset.add);sfx.coin();draw()}else if(r){given.splice(+r.dataset.rm,1);sfx.tap();draw()}};
  foot.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.dataset.act==="clr"){given.length=0;sfx.tap();draw();return}
   const sum=given.reduce((a,b)=>a+b,0);if(sum===need){view.drawer=false;finish();return}
   errs++;tries++;sfx.bad();catHmm();const hint=tries>=2?`<br>💡 ${t("hintCh",fmt(paid),fmt(tot),fmt(need))}`:"";draw((sum>need?t("much"):t("little"))+hint,"bad")}};
 const finish=()=>{body.onclick=foot.onclick=null;catCheer();st.cash+=tot;st.today.income+=tot;st.today.served++;if(!errs){st.stars++;st.starsTotal=(st.starsTotal||0)+1;st.today.stars++}X.onSale({errs,tot,got,c});save();hud();const w=errs?"👍":pick(t("bravo"));toast(w);showSheet(phase,`<b>${w}</b> 💰 ${t("cash")}: ${money(st.cash)}`,"","");resolve({errs,tot})};
 // étape 1 : le total
 if(L.totalMode==="auto"){drawScreen(fmt(tot));showSheet(phase,`${t("totA")} = <b>${money(tot)}</b>`,lineHTML("all"),`<span></span><button class="big" data-act="next">${t("next")}</button>`);foot.onclick=e=>{if(e.target.closest("[data-act=next]")){sfx.tap();goChange()}};return}
 if(L.totalMode==="choice"){const opts=new Set([tot]);const ds=[100,200,500,1000,-100,-200,-500,-1000,st.price[got[0].id],-st.price[got[0].id]];let g=0;while(opts.size<3&&g++<50){const v=tot+pick(ds);if(v>0)opts.add(v)}
  const draw=(msg="",show=false)=>{showSheet(phase,t("totQ"),`${lineHTML(show)}<div class="choices">${shuffle([...opts]).map(v=>`<button class="choice" data-c="${v}">${money(v)}</button>`).join("")}</div><div class="msg bad">${msg}</div>`,"")};
  draw();body.onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;if(+b.dataset.c===tot){sfx.coin();goChange()}else{errs++;tries++;sfx.bad();catHmm();b.classList.add("bad");opts.delete(+b.dataset.c);setTimeout(()=>draw(tries>=2?t("showT",money(tot)):t("wrongT"),true),400)}};return}
 // clavier
 let inp="";const drawK=(msg="",show=false,bad=false)=>{showSheet(phase,t("totQ"),`${lineHTML(show)}<div class="disp"><div class="scr ${bad?"bad":""}">${inp||"…"}</div><b>${t("dh")}</b></div>
  <div class="pad">${["7","8","9","⌫","4","5","6","OK","1","2","3","0",","].map(k=>k==="OK"?`<button class="okk" data-k="OK">✓</button>`:`<button data-k="${k}">${k}</button>`).join("")}</div><div class="msg bad">${msg}</div>`,"")};
 drawK();body.onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;sfx.tap();
  if(k==="⌫")inp=inp.slice(0,-1);else if(k===","){if(!inp.includes(",")&&inp)inp+=","}else if(k!=="OK"){if(inp.length<6&&!(inp.includes(",")&&inp.split(",")[1].length>=1))inp+=k}
  if(k!=="OK"){const y=body.scrollTop;drawK();body.scrollTop=y;return}
  const v=Math.round(parseFloat(inp.replace(",","."))*100);if(v===tot){sfx.coin();goChange();return}
  errs++;tries++;sfx.bad();catHmm();inp="";drawK(tries>=2?t("showT",money(tot)):t("wrongT"),true,true)}})}

/* ---------- 4. Bilan du jour ---------- */
function report(){st.phase="report";const L=LV[st.level],td=st.today;
 if(!td.rentPaid){st.cash-=L.rent;td.rentPaid=true}save();hud();
 const res=td.income-td.spent-L.rent;
 showSheet(t("phRep",st.day),res>=0?t("lProfit",`<b>${money(res)}</b>`):t("lLoss"),
  `<div class="rep"><div class="rrow in"><span>💚 ${t("inc")}</span><span class="v">+ ${money(td.income)}</span></div>
   <div class="rrow out"><span>📦 ${t("spent")}</span><span class="v">− ${money(td.spent)}</span></div>
   <div class="rrow out"><span>💡 ${t("rent")}</span><span class="v">− ${money(L.rent)}</span></div>
   <div class="rrow res"><span>${res>=0?"⭐ "+t("profit"):"📉 "+t("loss")}</span><span class="v">${res>=0?"":"− "}${money(Math.abs(res))}</span></div>
   <div class="rrow"><span>📦 ${t("leftV")}</span><span class="v">${money(P.reduce((a,p)=>a+Math.round(st.stock[p.id]*cartonCost(st.level,p.id)/cartonOf(p.id)),0))}</span></div>
   ${X.reportExtra(res)}
   <div class="badges"><span class="badge">😊 ${t("served")}: ${td.served}</span>${td.sad?`<span class="badge">😞 ${t("sadN")}: ${td.sad}</span>`:""}<span class="badge">⭐ ${t("starsT")}: ${td.stars}</span><span class="badge">💰 ${t("cash")}: ${money(st.cash)}</span></div></div>`,
  `${X.reportFootExtra()}<button class="big g" data-act="nd">${t("nextDay")}</button>`);
 if(res>0)sfx.good();X.afterReport(res);
 body.onclick=X.reportBodyClick;
 foot.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.dataset.act==="mini"){X.miniGame();return}if(b.dataset.act!=="nd")return;sfx.tap();st.day++;st.today=newToday();st.firstDone=true;X.newDay();save();hud();buyPhase()}}

 const box=$("#mg"),cv=$("#mgc"),W=box.clientWidth,H=box.clientHeight,dpr=Math.min(devicePixelRatio,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";const g=cv.getContext("2d");g.scale(dpr,dpr);
 let bx=W/2,score=0,time=25,items=[],spawn=0,lastT=performance.now(),run=true;const FR="🍎🍌🍐🍊🍓🍇🍉🥝".match(/\p{Extended_Pictographic}/gu);
 const mv=e=>{const r=box.getBoundingClientRect();bx=Math.max(30,Math.min(W-30,(e.touches?e.touches[0].clientX:e.clientX)-r.left))};box.addEventListener("pointermove",mv);box.addEventListener("pointerdown",mv);box.addEventListener("touchmove",e=>{mv(e);e.preventDefault()},{passive:false});
 const fr=now=>{if(!run)return;const dt=Math.min(.05,(now-lastT)/1000)*(FAST?4:1);lastT=now;time-=dt;spawn-=dt;

  g.clearRect(0,0,W,H);g.font="38px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";g.textAlign="center";g.textBaseline="middle";
  for(const it of items){it.y+=it.v*dt;g.fillText(it.e,it.x,it.y);if(!it.done&&it.y>H-60&&it.y<H-20&&Math.abs(it.x-bx)<42){it.done=true;if(it.bad){score=Math.max(0,score-2);sfx.bad()}else{score++;sfx.coin()}}}

  else if(["rabbit","bear","penguin"].includes(c.type)){say(c,{rabbit:"🥕 👋",bear:"🍯 👋",penguin:"🐟 👋"}[c.type]);sfx.pop();await sleep(1000)}},
 onSad(){st.today.sadAny=true},
 onSale({errs,tot,got,c}){const cn=st.cnt;cn.sales=(cn.sales||0)+1;if(!errs){cn.perfect=(cn.perfect||0)+1;confetti(26)}else st.today.errAny=true;
  if(c&&["rabbit","bear","penguin"].includes(c.type))cn.animal=(cn.animal||0)+1;if(c&&c.type==="vip"&&!errs)cn.vip=(cn.vip||0)+1;
  got.forEach(g=>{if(g.id==="umbrella")cn.umb=(cn.umb||0)+g.q;const ch=st.today.ch;if(ch&&ch.type==="sell"&&ch.id===g.id)ch.prog+=g.q});
  if(seller)seller.jump=.9;chHud();checkMedals()},
 async afterSale(c,got,res){if(c.type==="vip"&&res&&!res.errs){const tip=[100,500,500][st.level-1];st.cash+=tip;st.today.income+=tip;st.today.tips=(st.today.tips||0)+tip;save();hud();coinRain(14);say(c,`🪙 ${CUR(tip)}`,1600);setSay(t("tip",CUR(tip)));sfx.coin();await sleep(900)}},
 reportExtra(res){const td=st.today;let h="";
  if(td.ch){let ok=false;if(td.ch.type==="sell")ok=td.ch.prog>=td.ch.n;else if(td.ch.type==="perfect")ok=!td.errAny&&!td.sadAny&&td.served>0;else ok=res>=td.ch.n;
   if(ok&&!td.chRew){td.chRew=true;st.stars+=3;st.starsTotal=(st.starsTotal||0)+3;td.stars+=3}
   h+=`<div class="rrow" style="background:${ok?"#dcf5e7":"#fff"}"><span>${ok?t("chDone",3):t("chFail")}</span></div>`}
  if(td.event==="rush"&&!td.rushDone){td.rushDone=true;st.cnt.rush=(st.cnt.rush||0)+1}
  if(!td.stk&&td.served>0){td.stk=[];const free=STICKERS.filter(s=>!st.stickers.includes(s));const n=(res>=0&&!td.sadAny)?2:1;for(let i=0;i<n&&free.length;i++){const s=free.splice(rnd(free.length),1)[0];st.stickers.push(s);td.stk.push(s)}}
  if(td.stk&&td.stk.length)h+=`<div class="rrow"><span>📒 ${t("newStk")}</span><span class="v" style="font-size:30px">${td.stk.join(" ")}</span></div>`;
  const ne=eventOf(st.day+1);if(ne)h+=`<div class="rrow" style="background:#e8f2ff"><span>${t(ne==="rain"?"fcRain":"fcRush")}</span></div>`;
  h+=`<div class="pig"><span class="e">🐷</span><div style="flex:1"><div class="ph">${t("pigQ")}</div><div class="v" id="pigV">${t("pigHas",CUR(st.savings))}</div><div class="pigb">${steps().map(v=>`<button data-pig="${v}">+ ${CUR(v)}</button>`).join("")}</div></div></div>
   <p class="ph" style="margin:0;text-align:center">${t("pigWhy")}</p>`;
  save();return h},
 reportFootExtra:()=>st.today.miniDone?"<span></span>":`<button class="big w" data-act="mini">${t("miniB")}</button>`,
 reportBodyClick(e){const b=e.target.closest("[data-pig]");if(!b)return;const v=+b.dataset.pig;if(st.cash<v){sfx.bad();toast("💸");return}st.cash-=v;st.savings+=v;bankLog("l_dep",v);sfx.coin();coinRain(5);save();hud();
  $("#pigV").textContent=t("pigHas",CUR(st.savings));checkMedals()},
 afterReport(res){if(res>0){confetti(50);coinRain(10)}chHud();checkMedals()},
 newDay(){const td=st.today;if(st.day>1&&(st.day-1)%7===0&&st.savings>0){let i=Math.floor(st.savings*INTEREST/100/50)*50;if(st.level===1)i=Math.floor(st.savings*INTEREST/100/100)*100;if(i<=0&&st.savings>=1000)i=st.level===1?100:50;if(i>0){st.savings+=i;bankLog("l_int",i);td.interest=i}}},
 miniGame,
 onStateReset(){setProducts();rebuildShelves();applyDeco();applyWeather();chHud()},
 signText:()=>X_signText()
};
var X_signText;

/* ---------- Raccords ---------- */
const _hud=hud;hud=function(){_hud();chHud();const b=busy;["#bDeco","#bMap"].forEach(s=>{const el=$(s);if(el)el.style.opacity=b?.4:1})};
const _loop2=updateCat;updateCat=function(dt){_loop2(dt);updateRain(dt);updateDeco(dt,performance.now()/1000)};

/* ---------- Démarrage ---------- */
applyLang();X.onStateReset();resize();renderTitle();requestAnimationFrame(loop);
if(document.fonts)document.fonts.ready.then(()=>{drawSign();P.forEach(p=>drawTag(p.id))});
</script>
